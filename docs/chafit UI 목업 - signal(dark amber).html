<title>chafit Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101210; --bg-raised:#171916; --bg-tint:#1d201b;
  --ink:#edeee7; --ink-soft:#a8ac9e; --ink-faint:#6e7266;
  --line:#2a2d26;
  --accent:#f2b84b; --accent-ink:#101210; --accent-strong:#ffd98a; --accent-soft:#2e2412;
  --good:#6fcf97; --good-soft:#1b3226;
  --warn:#f2b84b; --warn-soft:#2e2412;
  --bad:#e5735c; --bad-soft:#3a241d;
  --r:4px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 20px 48px -16px rgba(0,0,0,.6);
  --font-sans:'IBM Plex Sans KR',-apple-system,'Malgun Gothic',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --sidebar-w:232px; --content-max:1040px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;background:var(--bg-tint);border:1px solid var(--line);border-radius:var(--r)}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
::selection{background:var(--accent-soft);color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.icon{width:17px;height:17px;flex:none;display:block}
.wrap{width:100%;max-width:var(--content-max)}

#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);flex:none;background:var(--bg-raised);border-right:1px solid var(--line);padding:20px 12px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
#main{flex:1;min-width:0;padding:44px 32px 80px;display:flex;justify-content:center}

.brand{display:flex;align-items:center;gap:9px;padding:6px 10px 20px;font-family:var(--font-mono);font-weight:600;font-size:15.5px;letter-spacing:.01em}
.brand .icon{width:21px;height:21px;color:var(--accent)}
.navGroupLabel{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:16px 10px 6px}
.navGroup:first-child .navGroupLabel{padding-top:4px}
.navItem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:var(--ink-soft);font-size:13.5px;font-weight:500;margin-bottom:1px}
.navItem:hover{background:var(--bg-tint);color:var(--ink)}
.navItem.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.navItem.active .icon{color:var(--accent)}
.sidebarFoot{margin-top:auto;padding:16px 10px 4px;font-size:11px;color:var(--ink-faint);border-top:1px solid var(--line);line-height:1.5}

.pageCrumb{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:10px}
.pageTitle{font-size:25px;letter-spacing:-.01em;margin:0 0 8px}
.pageSub{color:var(--ink-soft);font-size:14.5px;max-width:640px;margin:0 0 30px}
.pageHead{margin-bottom:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--r);font-size:13.5px;font-weight:600;border:1px solid transparent;transition:filter .12s,background .12s;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--bg-tint)}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px}

.card{background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--r);font-family:var(--font-mono);font-size:11px;letter-spacing:.02em;background:var(--bg-tint);color:var(--ink-soft);border:1px solid var(--line);white-space:nowrap}
.badge-accent{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent}
.badge-good{background:var(--good-soft);color:var(--good);border-color:transparent}
.badge-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

.fieldRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;align-items:center}
.fieldPill{height:32px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-raised);color:var(--ink-soft);font-size:12.5px;font-weight:600}
.fieldPill:hover{border-color:var(--ink-faint)}
.fieldPill.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.fieldCustomInput{display:flex;gap:8px;align-items:center}
.fieldCustomInput input{height:32px;padding:0 10px;font-size:12.5px;width:150px}

.notice{border:1px solid var(--line);background:var(--bg-tint);border-radius:var(--r);padding:12px 14px;font-size:12.5px;color:var(--ink-soft);display:flex;gap:8px}
.notice-warn{border-color:var(--warn);background:var(--warn-soft);color:var(--accent-strong)}
.notice .icon{margin-top:2px;color:var(--warn)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{padding:9px 4px;margin-bottom:-1px;color:var(--ink-soft);font-size:13.5px;font-weight:600;border-bottom:2px solid transparent;margin-right:18px}
.tab.active{color:var(--accent);border-color:var(--accent)}

.checkRow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.checkRow:last-child{border-bottom:none}
.checkRow input{margin-top:2px;accent-color:var(--accent)}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-raised);color:var(--ink);font-size:12.5px;margin:0 6px 6px 0}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.chipRow{display:flex;flex-wrap:wrap}

textarea.ta{width:100%;padding:12px;min-height:160px;resize:vertical;font-size:13px;line-height:1.6}
input.ti{width:100%;height:40px;padding:0 12px}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;font-family:var(--font-mono);letter-spacing:.02em}

.progressTrack{height:4px;background:var(--bg-tint);border-radius:2px;overflow:hidden;margin-bottom:6px}
.progressFill{height:100%;background:var(--accent);transition:width .2s}
.progressLabel{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-bottom:24px}

.tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{text-align:left;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg-tint)}
td{padding:12px 16px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}

.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.switch-track{width:36px;height:20px;border-radius:10px;background:var(--bg-tint);border:1px solid var(--line);position:relative;transition:background .15s}
.switch-track.on{background:var(--accent-soft);border-color:var(--accent)}
.switch-thumb{position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:var(--ink-faint);transition:transform .15s,background .15s}
.switch-track.on .switch-thumb{transform:translateX(16px);background:var(--accent)}

.evidenceItem{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.evidenceItem:last-child{border-bottom:none}
.evidenceItem .icon{margin-top:1px;flex:none}
.quote{font-size:12.5px;color:var(--ink-soft);font-style:normal;border-left:2px solid var(--line);padding-left:10px;margin-top:4px}

.statsStrip{display:flex;gap:32px;margin:20px 0 32px;flex-wrap:wrap}
.statBlock{display:flex;flex-direction:column;gap:2px}
.statPct{font-family:var(--font-mono);font-size:27px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.statLabel{font-size:11.5px;color:var(--ink-soft)}
.statFoot{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);margin-top:-4px}

.bento{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:auto auto;gap:16px;margin-bottom:40px}
.pathCard{border:1px solid var(--line);background:var(--bg-raised);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.pathCard.featured{grid-row:1/3;border-color:var(--accent);box-shadow:var(--shadow-md);background:linear-gradient(160deg,var(--accent-soft),var(--bg-raised) 60%)}
.pathTag{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase}
.pathCard.featured .pathTag{color:var(--accent-strong)}
.pathHead{font-size:16.5px;font-weight:700}
.pathBody{font-size:13px;color:var(--ink-soft);flex:1}
.pathMeta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-faint);text-transform:uppercase}

.principles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:8px}
.principleCard{border:1px solid var(--line);border-radius:var(--r);padding:16px;font-size:12.5px;color:var(--ink-soft)}
.principleCard b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:6px}

.emptyState{border:1px dashed var(--line);border-radius:var(--r);padding:48px 24px;text-align:center;color:var(--ink-soft)}
.emptyState .icon{width:32px;height:32px;color:var(--ink-faint);margin:0 auto 14px}

.dz{border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--ink-soft);cursor:pointer;background:var(--bg-tint)}
.dz:hover{border-color:var(--accent)}
.fileRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);margin-top:12px;font-size:13px}
.fileRow .icon{color:var(--accent)}
.fileRow button{margin-left:auto;color:var(--ink-faint)}

.barRow{display:flex;align-items:center;gap:12px;padding:8px 0}
.barLabel{width:180px;flex:none;font-size:12.5px}
.barTrack{flex:1;height:8px;background:var(--bg-tint);border-radius:4px;overflow:hidden}
.barFill{height:100%;border-radius:4px}
.barFill.good{background:var(--good)}
.barFill.bad{background:var(--bad)}
.barPct{width:88px;flex:none;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint)}

@media (max-width:760px){
  #app{flex-direction:column}
  #sidebar{position:static;width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:12px;gap:4px;align-items:center}
  .brand{padding:4px 10px}
  .navGroupLabel{display:none}
  .navGroup{display:flex;gap:2px}
  .sidebarFoot{display:none}
  #main{padding:28px 16px 60px}
  .bento{grid-template-columns:1fr;grid-template-rows:none}
  .pathCard.featured{grid-row:auto}
  .principles,.grid2,.grid3{grid-template-columns:1fr}
  .barLabel{width:110px}
}
</style>

<div id="app">
  <aside id="sidebar"></aside>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>

<script>
(function(){
"use strict";

function ls_get(k,fallback){ try{ const v=localStorage.getItem(k); return v===null?fallback:JSON.parse(v); }catch(e){ return fallback; } }
function ls_set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var I = {

function icon(name){ return '<span class="icon">'+(I[name]||'')+'</span>'; }

var NAV = [
  {label:'시작', items:[
    {href:'#/', label:'시작', icon:'house'}
  ]},
  {label:'내 경험 정리', items:[
    {href:'#/resume', label:'이력서', icon:'fileText'},

  ]},
  {label:'내 기록', items:[

    {href:'#/checklist', label:'체크리스트', icon:'checkSq'},
    {href:'#/competitiveness', label:'내 역량', icon:'chart'}
  ]}
];

function renderSidebar(){
  var cur = location.hash || '#/';
  var html = '<div class="brand">'+icon('signal')+'<span>chafit</span></div>';
  NAV.forEach(function(g){
    html += '<div class="navGroup"><div class="navGroupLabel">'+g.label+'</div>';
    g.items.forEach(function(it){
      var active = (it.href===cur) ? ' active' : '';
      html += '<a class="navItem'+active+'" href="'+it.href+'">'+icon(it.icon)+'<span>'+it.label+'</span></a>';
    });
    html += '</div>';
  });
  html += '<div class="sidebarFoot">회원가입 없이 세션 동안 이용합니다.</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function fieldSwitcher(){

    html += '<button class="fieldPill'+active+'" data-act="setField" data-id="'+k+'">'+FIELD_PRESETS[k].label+'</button>';

    html += '<button class="fieldPill" data-act="setField" data-id="custom">직접 입력</button>';

  html += '</div>';

function pageInterview(){
  var st = ls_get('chafit:interviewProgress', {step:0, answers:{}});
  if(st.step >= INTERVIEW_Q.length) return pageInterviewDone();
  var q = INTERVIEW_Q[st.step];
  var pct = Math.round((st.step)/INTERVIEW_Q.length*100);
  var body = '<div class="progressLabel">경험 정리 '+(st.step+1)+'/'+INTERVIEW_Q.length+' · 중간 저장됨</div>'+
    '<div class="progressTrack"><div class="progressFill" style="width:'+pct+'%"></div></div>';
  body += '<div class="grid2" style="align-items:start;margin-top:20px">';
  body += '<div class="card stack">';
  body += '<div style="font-size:17px;font-weight:700">'+esc(q.title)+'</div>';
  if(q.type==='text'){
    body += '<input class="ti" id="qInput" type="text" placeholder="'+esc(q.placeholder)+'" value="'+esc(st.answers[q.key]||'')+'">';
  } else {
    var chosen = st.answers[q.key] || (q.type==='multi' ? [] : null);
    body += '<div class="chipRow">';
    q.options.forEach(function(opt){
      var on = (q.type==='multi') ? (chosen.indexOf(opt)>-1) : (chosen===opt);
      body += '<button class="chip'+(on?' on':'')+'" data-act="qChoice" data-key="'+q.key+'" data-type="'+q.type+'" data-val="'+esc(opt)+'">'+esc(opt)+'</button>';
    });
    body += '</div>';
    if(q.extra){
      body += '<input class="ti" id="qExtra" type="text" placeholder="한 문장으로 더 설명해주세요 (선택)" value="'+esc(st.answers[q.key+'_extra']||'')+'" style="margin-top:8px">';
    }
  }
  body += '<div class="row" style="justify-content:space-between;margin-top:8px">';
  body += '<div class="row" style="gap:8px">';
  if(st.step>0) body += '<button class="btn btn-ghost" data-act="qPrev">이전</button>';
  body += '<a class="btn btn-ghost" href="#/job-map">건너뛰기</a>';
  body += '</div>';
  body += '<button class="btn btn-primary" data-act="qNext">'+(st.step===INTERVIEW_Q.length-1 ? '정리 끝내기' : '다음')+'</button>';
  body += '</div></div>';
  body += '<div class="card">';
  body += '<div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:10px">지금까지 모인 것</div>';
  var any=false;
  INTERVIEW_Q.forEach(function(qq,i){
    if(i<st.step && st.answers[qq.key]!=null && st.answers[qq.key]!==''){
      any=true;
      var v = st.answers[qq.key];
      body += '<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)"><span style="color:var(--ink-faint)">'+esc(qq.title)+'</span><br>'+esc(Array.isArray(v)?v.join(', '):v)+'</div>';
    }
  });
  if(!any) body += '<div style="font-size:12.5px;color:var(--ink-faint)">아직 없습니다.</div>';
  body += '</div>';
  body += '</div>';
  return body;
}

/* ---------- interactions (event delegation) ---------- */
document.getElementById('main').addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.dataset.act;

  if(act==='setField'){ setTargetField(el.dataset.id); render(); return; }
  if(act==='applyCustomField'){
    var v = document.getElementById('customFieldInput').value.trim() || '직접 입력';
    setTargetField('custom', v); render(); return;
  }
  if(act==='pickFile'){ document.getElementById('fileInput').click(); return; }
  if(act==='removeFile'){ ls_set('chafit:resume', null); render(); return; }
  if(act==='qChoice'){
    var st = ls_get('chafit:interviewProgress', {step:0, answers:{}});
    var key = el.dataset.key, type = el.dataset.type, val = el.dataset.val;
    if(type==='multi'){
      var arr = st.answers[key] || [];
      var idx = arr.indexOf(val);
      if(idx>-1) arr.splice(idx,1); else arr.push(val);
      st.answers[key] = arr;
    } else {
      st.answers[key] = val;
      if(key==='target'){
        var map = {'반도체 공정기술':'semiconductor','SW 개발':'software','마케팅':'marketing','UX/제품 디자인':'design'};
        if(map[val]) setTargetField(map[val]);
      }
    }
    ls_set('chafit:interviewProgress', st); render(); return;
  }
  if(act==='qPrev'){
    var st2 = ls_get('chafit:interviewProgress', {step:0, answers:{}});
    st2.step = Math.max(0, st2.step-1); ls_set('chafit:interviewProgress', st2); render(); return;
  }
  if(act==='qNext'){
    var st3 = ls_get('chafit:interviewProgress', {step:0, answers:{}});
    var q = INTERVIEW_Q[st3.step];
    if(q.type==='text'){
      var inp = document.getElementById('qInput');
      st3.answers[q.key] = inp ? inp.value : '';
    }
    if(q.extra){
      var ex = document.getElementById('qExtra');
      st3.answers[q.key+'_extra'] = ex ? ex.value : '';
    }
    st3.step += 1; ls_set('chafit:interviewProgress', st3); render(); return;
  }
  if(act==='jobMapTab'){ ls_set('chafit:jobMapTab', el.dataset.tab); render(); return; }
  if(act==='postMode'){
    var pd = ls_get('chafit:postingDraft', {mode:'text', text:'', url:'', ready:false, toggled:{}});
    pd.mode = el.dataset.mode; ls_set('chafit:postingDraft', pd); render(); return;
  }
  if(act==='postReady'){
    var pd2 = ls_get('chafit:postingDraft', {mode:'text', text:'', url:'', ready:false, toggled:{}});
    var ta = document.getElementById('postingText'); var ur = document.getElementById('postingUrl');
    if(ta) pd2.text = ta.value; if(ur) pd2.url = ur.value;
    pd2.ready = true; pd2.full = el.dataset.full==='1';
    ls_set('chafit:postingDraft', pd2); render(); return;
  }
  if(act==='postTagToggle'){
    var pd3 = ls_get('chafit:postingDraft', {mode:'text', text:'', url:'', ready:false, toggled:{}});
    var i = el.dataset.i;
    var f = getCurrentField();
    var cur = pd3.toggled[i]!=null ? pd3.toggled[i] : f.posting.tags[i].required;
    pd3.toggled[i] = !cur;
    ls_set('chafit:postingDraft', pd3); render(); return;
  }
  if(act==='postToDiagnosis'){ location.hash = '#/diagnosis'; return; }
  if(act==='printPage'){ window.print(); return; }
  if(act==='toggleScore'){ ls_set('chafit:showScore', !ls_get('chafit:showScore', false)); render(); return; }
  if(act==='addGap'){
    addChecklistItem(el.dataset.title, el.dataset.meta, '갭 리포트');
    render(); return;
  }
  if(act==='compMode'){ ls_set('chafit:compMode', el.dataset.mode); render(); return; }
  if(act==='toggleAlert'){
    var al = ls_get('chafit:companyAlerts', {});
    al[el.dataset.i] = !al[el.dataset.i];
    ls_set('chafit:companyAlerts', al); render(); return;
  }
  if(act==='clSelect'){ ls_set('chafit:clSelected', parseInt(el.dataset.i,10)); render(); return; }
  if(act==='clDraftShow'){ ls_set('chafit:clDraft'+ls_get('chafit:clSelected',0), true); render(); return; }
  if(act==='removeChecklist'){ removeChecklistItem(el.dataset.id); render(); return; }
});

document.getElementById('main').addEventListener('change', function(e){
  if(e.target.id==='fileInput'){
    var f = e.target.files[0];
    var err = document.getElementById('fileError');
    if(!f){ return; }
    var okType = /\.(pdf|txt)$/i.test(f.name);
    var okSize = f.size <= 5*1024*1024;
    if(!okType){ err.textContent = 'PDF 또는 TXT 파일만 지원합니다.'; return; }
    if(!okSize){ err.textContent = '5MB 이하 파일만 지원합니다.'; return; }
    ls_set('chafit:resume', {file:{name:f.name, size:Math.round(f.size/1024)+'KB'}});
    render();
  }
  if(e.target.id==='cAgree1' || e.target.id==='cAgree2'){
    var a1 = document.getElementById('cAgree1'), a2 = document.getElementById('cAgree2');
    var st = ls_get('chafit:resume', null);
    var submitBtn = document.getElementById('submitResume');
    if(submitBtn) submitBtn.disabled = !(st && st.file && a1.checked && a2.checked);
  }
});
document.getElementById('main').addEventListener('click', function(e){
  if(e.target.id==='submitResume' && !e.target.disabled){
    location.hash = '#/posting';
  }
});

render();
})();
</script>
