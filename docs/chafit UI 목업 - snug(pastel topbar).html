<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9ff; --bg-raised:#ffffff; --bg-tint:#f1effa;
  --ink:#33323d; --ink-soft:#726f82; --ink-faint:#a6a3b5; --line:#eae7f5;
  --accent:#7c9ce8; --accent-strong:#5f7fcb; --accent-soft:#e4ebfc; --secondary:#f2a9a0;
  --good:#4f8a68; --good-soft:#e3f0e8; --warn:#c46a5c; --warn-soft:#fbe9e6; --bad:#b23b2e; --bad-soft:#fbe1dc;
  --r-sm:16px; --r-md:22px; --r-lg:28px;
  --sh-sm:0 6px 14px -6px rgba(124,156,232,.18); --sh-md:0 16px 34px -16px rgba(124,156,232,.3);
  --header-h:76px; --max:1040px;
  --font-sans:'Noto Sans KR','Malgun Gothic',sans-serif;
  --font-head:'Jua','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);margin:0;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-head);font-weight:400;text-wrap:balance;color:var(--ink);margin:0}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--max);margin:0 auto;padding:32px 20px 80px}
@media (max-width:640px){.wrap{padding:20px 16px 64px}}

/* topbar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,249,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:var(--max);margin:0 auto;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-size:22px;color:var(--accent-strong);text-decoration:none}
.blobmark{width:34px;height:34px;flex:none}
.menubtn{display:flex;align-items:center;gap:8px;background:var(--bg-raised);border:none;box-shadow:var(--sh-sm);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;color:var(--ink)}
.menubtn svg{width:16px;height:16px}
.panel{position:absolute;left:0;right:0;top:var(--header-h);background:var(--bg-raised);box-shadow:var(--sh-md);border-radius:0 0 var(--r-lg) var(--r-lg);overflow:hidden;max-height:0;transition:max-height .28s ease}
.panel.open{max-height:640px}
.panel-inner{max-width:var(--max);margin:0 auto;padding:8px 20px 20px;overflow-x:auto}
.panel-groups{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:18px}
@media (max-width:820px){.panel-groups{grid-template-columns:repeat(2,minmax(140px,1fr))}}
.pgroup-label{font-size:12px;color:var(--ink-faint);font-weight:700;letter-spacing:.04em;margin:14px 0 6px}
.pnav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;color:var(--ink-soft);text-decoration:none;font-size:14px;font-weight:500}
.pnav-item svg{width:17px;height:17px;flex:none}
.pnav-item.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.pnav-item:hover{background:var(--bg-tint)}
.panel-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint)}

/* generic */
.card{background:var(--bg-raised);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:22px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700}
.badge-accent{background:var(--accent-soft);color:var(--accent-strong)}
.badge-good{background:var(--good-soft);color:var(--good)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-bad{background:var(--bad-soft);color:var(--bad)}
.badge-neutral{background:var(--bg-tint);color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;border:none;font-weight:700;font-size:15px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 10px 22px -10px rgba(124,156,232,.55)}
.btn-primary:hover{background:var(--accent-strong)}
.btn-ghost{background:var(--bg-tint);color:var(--ink)}
.btn-ghost:hover{background:var(--accent-soft);color:var(--accent-strong)}
.btn-sm{height:38px;padding:0 16px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pagehead{margin-bottom:22px}
.crumb{font-size:13px;color:var(--ink-faint);margin-bottom:8px}
.pagetitle{font-size:26px;margin-bottom:6px}
.pagesub{color:var(--ink-soft);font-size:14.5px}
.notice{background:var(--accent-soft);color:var(--accent-strong);border-radius:var(--r-sm);padding:12px 16px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.notice-warn{background:var(--warn-soft);color:var(--warn)}
.textarea,.textInput,select{width:100%;border:1px solid var(--line);background:var(--bg-raised);border-radius:var(--r-sm);padding:12px 14px;font-family:inherit;font-size:14.5px;color:var(--ink)}
.textarea{min-height:180px;resize:vertical}
.chip{display:inline-flex;align-items:center;padding:8px 16px;border-radius:999px;background:var(--bg-tint);color:var(--ink-soft);font-size:14px;font-weight:600;border:none}
.chip.on{background:var(--accent);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.grid3{grid-template-columns:1fr}}
.rowflex{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tablewrap{overflow-x:auto;border-radius:var(--r-md);box-shadow:var(--sh-sm)}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--bg-raised)}
th,td{padding:14px 16px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
th{color:var(--ink-faint);font-weight:700;font-size:12.5px;letter-spacing:.03em}
.mascot{width:56px;height:56px;flex:none}
.stepbar{display:flex;align-items:center;gap:10px;margin-bottom:26px;font-size:12.5px;color:var(--ink-faint);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.eyebrow{color:var(--accent-strong);font-weight:700;font-size:13px;letter-spacing:.03em}
.hero h1{font-size:34px;margin:2px 0 6px}
.herosub{color:var(--ink-soft);font-size:15.5px;max-width:560px}
.statsstrip{display:flex;gap:28px;flex-wrap:wrap;margin:26px 0 30px;padding:18px 22px;background:var(--bg-tint);border-radius:var(--r-md)}
.statpct{font-size:22px;font-weight:800;color:var(--accent-strong);font-variant-numeric:tabular-nums}
.statlabel{font-size:12.5px;color:var(--ink-soft)}
.statfoot{width:100%;font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.pathgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:36px}
@media (max-width:860px){.pathgrid{grid-template-columns:1fr}}
.pathcard{border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;gap:14px;min-height:220px}
.pathBlue{background:var(--accent-soft)}
.pathGreen{background:var(--good-soft)}
.pathFeatured{background:var(--secondary);color:#fff;transform:translateY(-8px);box-shadow:0 20px 38px -14px rgba(242,169,160,.55)}
.pathtag{font-size:12px;font-weight:700;opacity:.75}
.pathaudience{align-self:flex-start;font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.5);font-weight:700}
.pathFeatured .pathaudience{background:rgba(255,255,255,.28);color:#fff}
.pathmeta{font-size:12.5px;opacity:.8;margin-top:auto}
.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-top:26px;border-top:1px solid var(--line)}
@media (max-width:820px){.principles{grid-template-columns:1fr}}
.principle h3{font-size:15px;margin-bottom:6px}
.principle p{font-size:13.5px;color:var(--ink-soft);margin:0}

/* misc components */
.dropzone{border:2px dashed var(--line);border-radius:var(--r-md);padding:34px 20px;text-align:center;color:var(--ink-soft);background:var(--bg-tint)}
.dropzone.drag{border-color:var(--accent)}
.filerow{display:flex;align-items:center;gap:10px;background:var(--bg-raised);border-radius:var(--r-sm);padding:10px 14px;margin-top:12px;box-shadow:var(--sh-sm)}
.checkrow{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-soft);padding:10px 0;border-bottom:1px solid var(--line)}
.checkrow:last-child{border-bottom:none}
.checkrow input{margin-top:3px}
.tabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto}
.tabbtn{padding:10px 18px;border-radius:999px;background:var(--bg-tint);color:var(--ink-soft);border:none;font-weight:700;font-size:13.5px;white-space:nowrap}
.tabbtn.on{background:var(--accent);color:#fff}
.evrow{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.evrow:last-child{border-bottom:none}
.evrow svg{width:20px;height:20px;flex:none;margin-top:2px}
.togglewrap{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-soft)}
.toggle{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;border:none;flex:none}
.toggle .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--accent)}
.toggle.on .knob{left:21px}
.bar-outer{background:var(--bg-tint);border-radius:999px;height:10px;overflow:hidden}
.bar-inner{height:100%;border-radius:999px}
.fieldpills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.icon{width:17px;height:17px}
</style>

<div class="topbar">
  <div class="topbar-inner">
    <a href="#/home" class="brand">
      <svg class="blobmark" viewBox="0 0 40 40"><path fill="#7c9ce8" d="M20 3c8 0 15 5 16 13 1 9-6 21-16 21S2 25 3 16C4 8 12 3 20 3Z"/><circle cx="15" cy="18" r="2.4" fill="#fff"/><circle cx="25" cy="18" r="2.4" fill="#fff"/><path d="M14 25c2.5 2.5 9.5 2.5 12 0" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      chafit
    </a>
    <button class="menubtn" id="menuToggle" onclick="togglePanel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      메뉴
    </button>
  </div>
  <div class="panel" id="navPanel"><div class="panel-inner" id="navPanelInner"></div></div>
</div>

<div class="wrap" id="app"></div>

<script>
function ic(name){
  const P='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const M={
    house:'<path '+P+' d="M4 11.5 12 4l8 7.5"/><path '+P+' d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>',
    filetext:'<path '+P+' d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path '+P+' d="M14 3v4h4M9 12h6M9 15.5h6M9 9h3"/>',
    chats:'<path '+P+' d="M4 12a7 7 0 1 1 3 5.7L4 19l1.2-3.1A7 7 0 0 1 4 12Z"/><circle cx="9" cy="12" r=".6" fill="currentColor"/><circle cx="12" cy="12" r=".6" fill="currentColor"/><circle cx="15" cy="12" r=".6" fill="currentColor"/>',
    compass:'<circle cx="12" cy="12" r="9" '+P+'/><path '+P+' d="m15 9-5 2-1.5 5L14 14l1-5Z"/>',
    news:'<rect x="3" y="6" width="14" height="13" rx="1" '+P+'/><path '+P+' d="M17 9h3a1 1 0 0 1 1 1v8a2 2 0 0 1-2 2H7"/><path '+P+' d="M6 9.5h8M6 12.5h8M6 15.5h5"/>',
    target:'<circle cx="12" cy="12" r="8.5" '+P+'/><circle cx="12" cy="12" r="4.5" '+P+'/><circle cx="12" cy="12" r=".9" fill="currentColor"/>',
    listchecks:'<path '+P+' d="M9 6h11M9 12h11M9 18h11"/><path '+P+' d="m3.2 6 1 1L6 5.2M3.2 12l1 1L6 11.2M3.2 18l1 1 1.8-1.8"/>',
    star:'<path '+P+' d="M12 3.5 14.6 9l6 .9-4.4 4.2 1 6-5.2-2.8-5.2 2.8 1-6L3.4 9.9l6-.9Z"/>',
    notepencil:'<path '+P+' d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path '+P+' d="m9.5 17 .5-2.5 6-6 2 2-6 6Z"/>',
    clock:'<circle cx="12" cy="12" r="8.5" '+P+'/><path '+P+' d="M12 8v4l3 2"/><path '+P+' d="M4 5a10 10 0 0 0-1 3"/>',
    checksquare:'<rect x="4" y="4" width="16" height="16" rx="3" '+P+'/><path '+P+' d="m8.5 12.5 2.3 2.3L16 9.5"/>',
    chartup:'<path '+P+' d="M4 19V9M9.5 19V5M15 19v-8M20 19V3"/>',
    bell:'<path '+P+' d="M6 10a6 6 0 1 1 12 0c0 3 1 5 2 6H4c1-1 2-3 2-6Z"/><path '+P+' d="M10 19a2 2 0 0 0 4 0"/>',
    bellring:'<path '+P+' d="M6 10a6 6 0 1 1 12 0c0 3 1 5 2 6H4c1-1 2-3 2-6Z"/><path '+P+' d="M10 19a2 2 0 0 0 4 0M18.5 5.5a9 9 0 0 1 1.8 4M3.7 9.5a9 9 0 0 1 1.8-4"/>',
    upload:'<path '+P+' d="M12 15V4M8 8l4-4 4 4"/><path '+P+' d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',
    trash:'<path '+P+' d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12"/>',
    x:'<path '+P+' d="M6 6l12 12M18 6 6 18"/>',
    check:'<circle cx="12" cy="12" r="9" fill="var(--good-soft)"/><path stroke="var(--good)" stroke-width="2" stroke-linecap="round" fill="none" d="m8 12.5 2.5 2.5L16 9.5"/>',
    warn:'<circle cx="12" cy="12" r="9" fill="var(--warn-soft)"/><path stroke="var(--warn)" stroke-width="2" stroke-linecap="round" fill="none" d="M12 8v5M12 16.2v.1"/>'
  };
  return '<svg class="icon" viewBox="0 0 24 24">'+(M[name]||M.star)+'</svg>';
}

const NAV=[
  {label:'시작',items:[{t:'시작',i:'house',h:'#/home'}]},
  {label:'내 경험 정리',items:[{t:'이력서',i:'filetext',h:'#/resume'},{t:'문답 정리',i:'chats',h:'#/interview'},{t:'직무 지도',i:'compass',h:'#/job-map'}]},
  {label:'적합도 진단',items:[{t:'공고 요약',i:'news',h:'#/posting'},{t:'적합도 진단',i:'target',h:'#/diagnosis'},{t:'갭 리포트',i:'listchecks',h:'#/gap-report'}]},
  {label:'활용',items:[{t:'관심 기업',i:'star',h:'#/companies'},{t:'자소서',i:'notepencil',h:'#/cover-letter'}]},
  {label:'내 기록',items:[{t:'진단 이력',i:'clock',h:'#/history'},{t:'체크리스트',i:'checksquare',h:'#/checklist'},{t:'내 역량',i:'chartup',h:'#/competitiveness'}]}
];

function renderPanel(){
  const cur=location.hash||'#/home';
  document.getElementById('navPanelInner').innerHTML=
    '<div class="panel-groups">'+NAV.map(g=>
      '<div><div class="pgroup-label">'+g.label+'</div>'+
      g.items.map(it=>'<a class="pnav-item'+(cur===it.h?' active':'')+'" href="'+it.h+'">'+ic(it.i)+it.t+'</a>').join('')+
      '</div>'
    ).join('')+'</div>'+
    '<div class="panel-foot">회원가입 없이 세션 동안 이용합니다.</div>';
}
function togglePanel(){document.getElementById('navPanel').classList.toggle('open')}
window.addEventListener('hashchange',()=>{document.getElementById('navPanel').classList.remove('open');renderPanel();route();window.scrollTo(0,0)});

/* ---------- state helpers ---------- */
function ls_get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function ls_set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ss_get(k){try{const v=sessionStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function ss_set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function getFieldId(){return ls_get('chafit:targetFieldId','semiconductor')}
function getFieldLabel(){return ls_get('chafit:targetFieldLabel','')}
function getField(){
  const id=getFieldId();
  if(id==='custom') return buildCustomField(getFieldLabel());
  return FIELD_PRESETS[id]||FIELD_PRESETS.semiconductor;
}
function setField(id,label){ls_set('chafit:targetFieldId',id);ls_set('chafit:targetFieldLabel',label||'');route()}

function getChecklist(){try{return JSON.parse(ls_get('chafit:checklist','[]'))}catch(e){return []}}
function addChecklistItem(item){const list=getChecklist();if(list.some(i=>i.id===item.id))return;list.push(item);ls_set('chafit:checklist',JSON.stringify(list))}
function removeChecklistItem(id){const list=getChecklist().filter(i=>i.id!==id);ls_set('chafit:checklist',JSON.stringify(list));route()}

/* ---------- FieldSwitcher ---------- */
function fieldSwitcher(){
  const cur=getFieldId();
  const presets=Object.keys(FIELD_PRESETS).map(id=>({id,label:FIELD_PRESETS[id].label}));
  presets.push({id:'custom',label:getFieldId()==='custom'&&getFieldLabel()?getFieldLabel():'직접 입력'});
  let html='<div class="fieldpills">'+presets.map(p=>
    '<button class="chip'+(cur===p.id?' on':'')+'" onclick="onFieldPill(\''+p.id+'\')">'+p.label+'</button>'
  ).join('')+'</div>';
  if(cur==='custom'){
    html+='<div id="customFieldBox" style="display:flex;gap:8px;margin:-8px 0 18px">'+
      '<input class="textInput" id="customFieldInput" placeholder="예: 물류 운영" value="'+(getFieldLabel()||'')+'" style="max-width:240px">'+
      '<button class="btn btn-ghost btn-sm" onclick="applyCustomField()">적용</button></div>';
  }
  return html;
}
function onFieldPill(id){
  if(id==='custom'){setField('custom',getFieldLabel());return}
  setField(id,FIELD_PRESETS[id].label);
}
function applyCustomField(){
  const v=document.getElementById('customFieldInput').value.trim();
  setField('custom',v||'직접 입력');
}

function onFilePick(e){handleFile(e.target.files&&e.target.files[0])}
function onDrop(e){e.preventDefault();e.currentTarget.classList.remove('drag');handleFile(e.dataTransfer.files&&e.dataTransfer.files[0])}
function handleFile(f){
  const err=document.getElementById('fileErr');
  if(!f){return}
  const okType=/\.(pdf|txt)$/i.test(f.name);
  if(!okType){err.textContent='.pdf 또는 .txt 파일만 올릴 수 있어요.';return}
  if(f.size>5*1024*1024){err.textContent='5MB 이하 파일만 올릴 수 있어요.';return}
  err.textContent='';
  ss_set('chafit:resumeFile',{name:f.name,size:(f.size/1024).toFixed(0)+'KB'});
  route();
}
function clearFile(){ss_set('chafit:resumeFile',null);route()}
function updateConsent(){
  const c2=document.getElementById('c2').checked;
  const file=ss_get('chafit:resumeFile');
  document.getElementById('submitResume').disabled=!(c2&&file);
}
function submitResume(){ss_set('chafit:resume',{done:true});location.hash='#/posting'}

function interviewQuestions(){
  const chip=(name,opts,multi)=>'<div style="display:flex;gap:8px;flex-wrap:wrap">'+opts.map(o=>{
    const cur=window.__iv.answers[name]||(multi?[]:null);
    const on=multi?cur.includes(o):cur===o;
    return '<button class="chip'+(on?' on':'')+'" onclick="ivChip(\''+name+'\',\''+o+'\','+multi+')">'+o+'</button>';
  }).join('')+'</div>';
  return [
    {key:'major',title:'전공이 뭐예요?',render:s=>'<input class="textInput" value="'+(s.answers.major||'')+'" oninput="ivText(\'major\',this.value)" placeholder="예: 신소재공학과">'},
    {key:'status',title:'지금 상태가 어때요?',render:()=>chip('status',['1·2학년','3학년','4학년','졸업 준비','직무 전환'],false)},
    {key:'experience',title:'해본 경험을 골라줘요',render:s=>chip('experience',['공정·장비실습','데이터분석 과제','캡스톤·팀프로젝트','학회·연구실','인턴','교내 공모전','자격증 준비','아르바이트·현장경험','해당없음'],true)+
      '<textarea class="textarea" style="min-height:80px;margin-top:12px" placeholder="한 문장으로 더 설명해줘요" oninput="ivText(\'experienceNote\',this.value)">'+(s.answers.experienceNote||'')+'</textarea>'},
    {key:'targetField',title:'어떤 직무를 목표로 해요?',render:()=>chip('targetField',['반도체 공정기술','SW 개발','마케팅','UX·제품 디자인','아직 미정'],false)},
    {key:'certificate',title:'준비 중인 자격이 있어요?',render:()=>chip('certificate',['기사·산업기사','품질경영기사','토익·토스','관련 자격 없음'],true)},
    {key:'internship',title:'인턴 경험이 있어요?',render:()=>chip('internship',['있음','없음','현재 지원 중'],false)},
    {key:'worry',title:'가장 걱정되는 게 뭐예요?',render:()=>chip('worry',['경험 부족','방향이 불확실함','자기소개서 작성','정보 부족'],false)}
  ];
}
function ivChip(name,val,multi){
  const st=window.__iv;
  if(multi){const arr=st.answers[name]||[];const i=arr.indexOf(val);i>-1?arr.splice(i,1):arr.push(val);st.answers[name]=arr}
  else{st.answers[name]=val}
  if(name==='targetField'){
    const map={'반도체 공정기술':'semiconductor','SW 개발':'software','마케팅':'marketing','UX·제품 디자인':'design'};
    if(map[val]) setField(map[val],val);
  }
  ss_set('chafit:interviewState',st);renderApp();
}
function ivText(name,val){window.__iv.answers[name]=val;ss_set('chafit:interviewState',window.__iv)}
function ivPrev(){window.__iv.step--;ss_set('chafit:interviewState',window.__iv);renderApp()}
function ivNext(){
  const st=window.__iv;
  if(st.step===7){st.done=true}else{st.step++}
  ss_set('chafit:interviewState',st);renderApp();
}
function ivSummary(st){
  const a=st.answers;
  const rows=[['전공',a.major],['상태',a.status],['경험',(a.experience||[]).join(', ')],['목표 직무',a.targetField],['자격',(a.certificate||[]).join(', ')],['인턴',a.internship],['고민',a.worry]];
  return rows.filter(r=>r[1]).map(r=>'<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)"><span style="color:var(--ink-faint)">'+r[0]+'</span> · '+r[1]+'</div>').join('')||'<div style="font-size:13px;color:var(--ink-faint)">아직 답한 내용이 없어요.</div>';
}
